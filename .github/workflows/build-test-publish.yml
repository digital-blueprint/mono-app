name: Build, Test and Publish
on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/_playwright_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          check-latest: true
          cache: "npm"

      - name: Restore playwright cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install test dependencies
        run: |
          ./node_modules/.bin/playwright install-deps chromium firefox

      - name: Run build
        run: APP_ENV=development npm run build

      - name: Run tests
        run: npm run test-full

      - name: Run checks
        run: npm run check

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Publish to NPM
        if: github.ref == 'refs/heads/main'
        run: |
          if npx --yes can-npm-publish --verbose; then
            npm install -g npm@latest
            npm ci
            npm run build
            npm publish
          fi

      - name: Deploy and wait for completion
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production'
        uses: digital-blueprint/gitlab-pipeline-trigger-action@ea146cbf06786a3f1637a830b799495136c026b1 # v1.4.2
        with:
          host: "gitlab.tugraz.at"
          trigger_token: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          access_token: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
          id: "21238"
          ref: "main"
          variables: '{"UPSTREAM_PROJECT_PATH":"dbp/mono/mono","UPSTREAM_COMMIT_BRANCH":"${{ github.ref_name }}","UPSTREAM_COMMIT_SHA":"${{ github.ref_name }}"}'
